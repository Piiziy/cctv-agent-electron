name = "scene-stealer-demo-push"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# 구독 보관함. id 는 아래 명령이 찍어 주는 값으로 바꾼다:
#   npx wrangler kv namespace create SUBS
#   npx wrangler kv namespace create SUBS --preview
[[kv_namespaces]]
binding = "SUBS"
id = "여기에_KV_NAMESPACE_ID"
preview_id = "여기에_PREVIEW_ID"

# 확인(ack) 로그만 Durable Object 다. KV 는 최종 일관성이라 폰이 쓴 걸 데스크톱이 바로 못 읽는다
[[durable_objects.bindings]]
name = "ACK_LOG"
class_name = "AckLog"

# new_sqlite_classes 여야 무료 플랜에서 쓸 수 있다 (new_classes 는 유료 전용이다).
# 한 번 배포한 뒤에는 이 tag 를 바꾸거나 지우지 마라 — 마이그레이션 이력이다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AckLog"]

[vars]
# npm run vapid 가 찍어 주는 공개키. 공개돼도 되는 값이라 커밋해도 된다
VAPID_PUBLIC_KEY = ""
# 푸시 서비스가 문제 생겼을 때 연락할 곳. mailto: 또는 https URL
VAPID_SUBJECT = "mailto:demo@example.com"

# VAPID_PRIVATE_KEY 는 여기 두지 않는다. 시크릿으로만 넣는다:
#   npx wrangler secret put VAPID_PRIVATE_KEY
# 로컬 개발(wrangler dev)은 .dev.vars 파일에서 읽는다 (.gitignore 에 들어 있다)

[observability]
enabled = true
