<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 대회 제출용 비공개 주소. 검색에 걸리지 않게 한다. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 제목은 안의 앱을 따라간다 (live.ts). -->
    <title>Scene Stealer</title>
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body class="app-window">
    <!--
      매장 PC 앱을 창 가득 띄운다. 설명·진행 표시를 덧붙이지 않는다 — 실제 앱 화면 그대로다.
      앱이 데모 계정으로 로그인해 시연 영상을 카메라 삼아 실제 서버로 조각을 올린다.
      휴대폰으로 열면 사장님 앱으로 바로 넘어간다.
    -->
    <iframe id="pc" title="Scene Stealer"></iframe>

    <!-- 시작하지 못했을 때만 뜬다. 로그인 화면 같은 엉뚱한 화면을 보이는 대신 이유를 그대로 적는다. -->
    <section class="notice" id="notice" hidden>
      <div class="notice-card">
        <h1>실서버 시연을 시작하지 못했습니다</h1>
        <p id="notice-message"></p>
        <ul class="notice-list" id="notice-missing" hidden></ul>
        <p class="sub" id="notice-hint" hidden>
          Vercel 프로젝트 Settings → Environment Variables 에 위 값을 넣고 다시 배포하면 됩니다.
          자세한 절차는 저장소의 docs/demo-submission.md 에 있습니다.
        </p>
      </div>
    </section>

    <script type="module" src="../src/live.ts"></script>
  </body>
</html>
